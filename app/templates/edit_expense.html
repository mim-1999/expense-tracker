{% extends "base.html" %}

{% block content %}

<h2>Edit Expense</h2>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" name="title" value="{{ expense.title }}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Amount</label>
        <input type="number" step="0.01" min="0" name="amount" value="{{ expense.amount }}" class="form-control"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Category</label>
        <select name="category" class="form-control" required>
            <option value="">Select a category</option>
            <option value="Food" {% if expense.category=="Food" %}selected{% endif %}>Food</option>
            <option value="Transport" {% if expense.category=="Transport" %}selected{% endif %}>Transport</option>
            <option value="Shopping" {% if expense.category=="Shopping" %}selected{% endif %}>Shopping</option>
            <option value="Bills" {% if expense.category=="Bills" %}selected{% endif %}>Bills</option>
            <option value="Entertainment" {% if expense.category=="Entertainment" %}selected{% endif %}>Entertainment
            </option>
            <option value="Other" {% if expense.category=="Other" %}selected{% endif %}>Other</option>
        </select>
    </div>

    <button class="btn btn-primary">
        Update Expense
    </button>
    <a href="{{ url_for('main.home') }}" class="btn btn-secondary"> Cancel </a>

</form>

{% endblock %}
